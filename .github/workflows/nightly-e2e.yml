name: Nightly cross-browser E2E

# Runs the full Playwright suite across all three engines every night.
# PRs and pushes to main stay chromium-only (ci.yml's e2e job) — see
# README.md's "E2E browser policy & sharding" section for the reasoning.
# Starts 90 minutes before nightly-frontend-flakes.yml's 22:30 cron so the
# two nightly jobs don't contend for runners — this one fans out to 9
# concurrent shards and can run ~15 minutes on a bad night.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # firefox/webkit are unproven at repo scale: a 9-test smoke-only probe
    # during #440's planning found no engine-specific failures, but never
    # touched the axe (96 tests), reflow (160 tests) or target-size (36
    # tests) suites. Run them nightly without failing the workflow, until a
    # follow-up issue triages and greens them — then delete this line.
    #
    # This MUST stay at job level, not on the "E2E tests" step. A
    # step-level continue-on-error leaves the step's *conclusion* as
    # success and never sets the job status to failure, so the two
    # `if: failure()` artifact uploads below would never fire and a red
    # webkit shard would upload nothing at all. At job level the job still
    # goes red (so the failure is visible in the run summary and the
    # uploads run), while the workflow overall stays green.
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    # Generous because this is a 21:00 cron nobody waits on, and because a
    # job-level timeout *cancels* the job — cancellation is not absorbed by
    # continue-on-error and skips the `failure()` uploads, so a timeout is
    # the one failure mode that yields no triage artifacts. The per-step
    # timeout below is the intended stop, this is only a backstop.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # Same 3-way within-browser sharding as ci.yml's e2e job (#440), but
      # all three engines instead of chromium only — this workflow is the
      # three-browser matrix's actual home now that E2E_BROWSERS_JSON is
      # (deliberately) left unset on PRs/pushes. Keep the shard count here
      # in lockstep with the `name:` above and the `--shard=N/3` flag below.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: betonboi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # [#3146] The server needs a real S3 at :9000 (seed + the backup/restore
      # journey). This job had none, so every night died with ECONNREFUSED.
      # Same service as ci.yml's e2e job.
      seaweedfs:
        image: chrislusf/seaweedfs:4.48
        env:
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key
          S3_BUCKET: biddaloy-ci
        ports:
          - 9000:8333
        options: >-
          --health-cmd "curl -sf -o /dev/null http://localhost:8333/status && curl -sf -o /dev/null http://localhost:8888/buckets/biddaloy-ci/"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/betonboi_e2e
      # Same flag as ci.yml's e2e job (activation/recovery specs read tokens).
      ACCOUNT_ACCESS_ECHO_SECRETS: 'true'
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-e2e-jwt-secret-do-not-use-in-production-1234567890
      # Every e2e spec approves as the one seeded admin, so the whole run shares
      # step-up's 5-per-15-min verification budget (step-up.service.ts). Raised
      # for this job only; the server default stays 5.
      STEP_UP_RATE_LIMIT_MAX_ATTEMPTS: '1000'
      NODE_ENV: test
      SEED_ADMIN_PASSWORD: ci-e2e-seed-password-123
      # [15.5] See ci.yml's "integration"/"e2e" jobs — `StorageModule` is a
      # boot-time dependency of `AppModule` now, needed by `seed` below.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: biddaloy-ci
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_ALLOW_INSECURE_HTTP: 'true'
      S3_FORCE_PATH_STYLE: 'true'
      # Keeps playwright.config.ts's projects list consistent with the
      # --project flag this matrix entry passes.
      E2E_BROWSERS: ${{ matrix.browser }}
      # [44.2.03] Same as ci.yml's e2e job: Vite inlines this when `yarn e2e` builds
      # client-admin; without it every (?) and F1 are hidden and help.spec.ts fails.
      VITE_HANDBOOK_URL: https://schoolmanagerp.gitbook.io/schoolmanagerp-docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build shared package
        # webServer boots the real server/clients (yarn dev:*), which resolve
        # @biddaloy/shared through its package.json "main" (dist/index.js,
        # not src) — same reason ci.yml's e2e job builds this first.
        run: yarn build:shared

      - name: Build site-themes package
        run: yarn build:site-themes

      # Mirrors ci.yml's e2e job: the package version drives the cache key,
      # so a Playwright bump misses the key and reinstalls. No
      # `restore-keys:` here either — see ci.yml's e2e job for why a prefix
      # match would restore stale version-stamped browser directories and
      # grow the cache entry on every bump.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser (${{ matrix.browser }})
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run migrations
        run: yarn workspace @biddaloy/server migration:run

      - name: Seed database
        run: yarn workspace @biddaloy/server seed

      # No PWA/offline suite here — it's chromium-CDP-only by design
      # (see ci.yml's e2e job comment) and already runs on every PR, so
      # there's nothing cross-browser for it to add nightly.
      #
      # Bounded here rather than by the job timeout so that an overrunning
      # leg *fails* (absorbed by the job's continue-on-error, artifacts
      # still uploaded) instead of being cancelled with nothing to show.
      # 30 min is deliberately loose: on a first red night, Playwright's
      # default 30s per-test timeout plus `retries: 1` means a
      # timing-out test costs ~60s, so a shard full of them is slow in
      # exactly the situation where the report matters most.
      - name: E2E tests (${{ matrix.browser }} ${{ matrix.shard }}/3)
        timeout-minutes: 30
        run: yarn e2e --project=${{ matrix.browser }} --project=${{ matrix.browser }}-sweeps --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  # [#759] Sticky-issue failure visibility, one per nightly workflow — see
  # scripts/nightly-sticky-issue.sh's header. `needs: [e2e]` rolls the whole
  # matrix up to one result: continue-on-error on the job means the
  # firefox/webkit legs report success to `needs.*.result` even when their
  # steps fail, so only a real chromium (or a non-continue-on-error) failure
  # turns this red — matches the "known unproven engines" comment above.
  report:
    name: Report nightly status
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.e2e.result }}" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Write report body
        if: steps.status.outputs.status == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Nightly cross-browser E2E failed."
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Failed jobs:"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
              --jq '.jobs[] | select(.conclusion=="failure") | "- " + .name' \
              || echo "- (unable to list failed jobs — see run link above)"
          } > nightly-report.md

      - name: Report status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/nightly-sticky-issue.sh \
            nightly-e2e-red \
            "Nightly cross-browser E2E is red" \
            nightly-report.md \
            "${{ steps.status.outputs.status }}"
